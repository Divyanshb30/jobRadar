# Company watchlist — pulled DIRECTLY from each employer's ATS board (free, no
# auth). Highest-signal, zero-aggregator-noise source. Every token below was
# verified live (returns jobs) on 2026-08-26; re-verify if a company 404s.
#
# ats: greenhouse | lever | ashby   (endpoint chosen by platform)
#   greenhouse -> https://boards-api.greenhouse.io/v1/boards/{token}/jobs?content=true
#   lever      -> https://api.lever.co/v0/postings/{token}?mode=json
#   ashby      -> https://api.ashbyhq.com/posting-api/job-board/{token}
# geo: informational tag (global | uae). Titles are still pre-filtered to AI/ML
# and routed/visa-checked by the normal pipeline, so add any company freely.

