# Pipeline definitions, geography routing, role keyword filters.

# Search terms fed to the scrapers. ORDER MATTERS: Apify uses only the first
# `apify.queries_per_run` (see sources.yaml) of these per actor run, so the most
# resume-aligned titles lead. Divyansh's profile = production LLM / agentic / RAG
# on Azure OpenAI, so AI/GenAI/Applied-AI/Agentic + Forward Deployed lead the list.
search_keywords:
  - "AI Engineer"
  - "GenAI Engineer"
  - "Applied AI Engineer"
  - "Forward Deployed Engineer"
  - "Agentic AI Engineer"
  - "LLM Engineer"
  - "Machine Learning Engineer"
  - "ML Engineer"
  - "NLP Engineer"
  - "MLOps Engineer"
  - "Data Scientist"

target_roles:
  primary:
    - "AI Engineer"
    - "GenAI Engineer"
    - "Applied AI Engineer"
    - "Forward Deployed Engineer"   # FDE at AI product cos = strong resume fit
    - "Agentic AI Engineer"
    - "LLM Engineer"
    - "ML Engineer"
    - "Machine Learning Engineer"
    - "NLP Engineer"
    - "MLOps Engineer"
  secondary:
    - "Data Scientist"   # kept only if the LLM confirms it is ML-heavy

# Title MUST match this to survive the pre-filter (case-insensitive).
# "forward deployed" is whitelisted because FDE roles at AI product companies
# (Palantir, OpenAI, Anthropic-style) rarely carry an explicit ML keyword in the
# title yet are a strong fit — the LLM role_fit check downstream vets them.
title_keywords_regex: "(ai\\s*engineer|applied\\s*ai|machine\\s*learn|ml\\s*engineer|genai|generative\\s*ai|agentic|forward\\s*deployed|nlp|mlops|deep\\s*learn|llm|data\\s*scien|artificial\\s*intel)"

# If the title matches this, drop it (senior/lead/etc. above the experience gate).
title_exclusion_regex: "(senior|\\bsr\\.?\\b|staff|principal|\\blead\\b|\\barchitect\\b|director|head\\s+of|vp\\s+of|\\bmanager\\b|\\bintern\\b|phd\\s+required|(?:1[0-9]|[3-9])\\+\\s*years)"

# Aggregator / search-index pages (mostly from Google Jobs organic results) are
# not real listings — e.g. "1597 NLP engineer jobs in India", "ML Engineer Jobs,
# Careers & Recruitment". A genuine job title almost never contains the plural
# word "jobs" or a leading result count, so those are reliable junk signals.
junk_title_patterns:
  - "\\bjobs\\b"                 # plural 'jobs' -> index/aggregator page
  - "^\\s*\\d[\\d,]*\\+?\\s"     # leading result count: '1597 ', '3000+ '
  - "careers?\\s*&"             # 'Careers & Recruitment'
  - "\\bvacanc"                 # 'vacancies' listing pages

experience_gate:
  max_years: 2
  drop_if_title_contains: ["senior", "staff", "principal", "lead", "director"]

# Hard-drop listings that MANDATE a PhD/doctorate. Checked against title AND
# description (the old title-only "phd required" rule missed the common case
# where the requirement is stated in the body). Deliberately conservative: only
# explicit *requirements* match. "PhD preferred / a plus / nice to have / or
# equivalent / or a Master's" must NOT match — the LLM `phd_required` field is
# the backstop for phrasings these regexes don't catch.
phd_required_patterns:
  - "ph\\.?\\s?d\\.?[^.\\n]{0,40}\\b(is\\s+)?(required|mandatory|essential|a must)\\b"
  - "\\b(must|required to)\\s+(have|hold|possess)[^.\\n]{0,30}\\bph\\.?\\s?d\\b"
  - "\\brequires?\\s+(a\\s+|an\\s+)?(ph\\.?\\s?d|doctorate|doctoral)\\b"
  - "\\bdoctora(te|l)\\b[^.\\n]{0,30}\\b(required|mandatory|essential)\\b"
  - "\\bph\\.?\\s?d\\.?\\s+(in\\s+[\\w /]+)?\\s*(is\\s+)?required\\b"

# If any of these "softener" phrases sits near a PhD mention, the requirement is
# NOT mandatory (preferred / optional / or-equivalent), so the drop above is
# vetoed. Bias is conservative: when in doubt, KEEP and let the LLM decide.
phd_softener_regex: "(preferred|not\\s+required|a\\s+plus|nice\\s+to\\s+have|desirable|advantageous|or\\s+equivalent|or\\s+(a\\s+)?(m\\.?s\\.?|master|msc|bachelor|b\\.?s\\.?|beng|degree))"

staleness_hours: 48

pipelines:
  india:
    geographies: ["india", "bangalore", "bengaluru", "mumbai", "delhi", "hyderabad", "pune", "chennai", "noida", "gurgaon", "gurugram", "kolkata", "ahmedabad"]
    remote_ok: true
    visa_required: false
    min_ctc_lpa: 15   # realistic floor for 0-2 YoE AI/ML in India (25 dropped almost all juniors)
    salary_undisclosed_action: "keep"   # LLM estimates; drop only if estimate < floor

  international:
    # Dubai / UAE lead — it is the top-priority geography (see scoring.yaml
    # priority_boost). Singapore intentionally removed from scope.
    geographies: ["dubai", "abu dhabi", "uae", "united arab emirates", "united kingdom", "uk", "london", "manchester", "cambridge", "edinburgh", "oxford", "bristol", "leeds", "birmingham", "germany", "berlin", "munich", "netherlands", "amsterdam", "ireland", "dublin", "europe"]
    remote_ok: true
    visa_required: true
    visa_no_action: "drop"              # hard drop, no exceptions
    visa_unknown_action: "keep"
    priority_countries: ["united arab emirates", "united kingdom"]

# Regexes that hard-drop a listing at pre-filter (before any LLM cost) when the
# description explicitly rules out sponsorship. International pipeline only.
visa_no_patterns:
  - "must have (the |existing )?(right to work|work author(?:i[sz])ation|work permit)"
  - "(cannot|can'?t|unable to|will not|won'?t|do not|don'?t)\\s+(\\w+\\s+){0,3}sponsor"
  - "no visa sponsorship"
  - "not (able to |in a position to )?sponsor"
  - "existing work (visa|permit) required"
  - "must be (eligible|authoris?ed) to work"
  - "not (offering|providing) (visa )?sponsorship"
  - "without (visa )?sponsorship"
  - "sponsorship is not available"
